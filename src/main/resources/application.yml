  jwt-secret: ${JWT_SECRET:o-zingizning-uzun-maxfiy-kalitingiz-kamida-32-belgi}
  jwt-days: 7
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
