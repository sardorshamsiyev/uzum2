server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bozor}
    username: ${DB_USER:bozor}
    password: ${DB_PASS:bozor}
    hikari:
      maximum-pool-size: 5
      max-lifetime: 240000
